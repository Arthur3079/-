version: "3.9"

# Two long-running services share one SQLite volume:
#   - sonya:       Telethon userbot (user account)
#   - payment_bot: Bot API process for Stars invoices (skipped when token unset)
#
# Both processes hit /app/data/sonya.db; alembic migrations run inside `sonya`
# at startup (see sonya/main.py) so don't run it elsewhere.

services:
  sonya:
    build:
      context: .
      dockerfile: Dockerfile
    image: sonya:latest
    container_name: sonya
    restart: unless-stopped
    env_file: .env
    volumes:
      - sonya-data:/app/data
      - sonya-logs:/app/logs
      - ./knowledge:/app/knowledge:ro
      # Mount the Telethon session file outside the container so re-deploys
      # don't require a fresh login.
      - ./sessions:/app/sessions
    environment:
      - TELEGRAM_SESSION_NAME=/app/sessions/sonya
    command: ["python", "-m", "sonya.main"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sonya.config; sonya.config.get_settings()"]
      interval: 60s
      timeout: 10s
      retries: 3

  payment_bot:
    image: sonya:latest
    container_name: sonya-payment-bot
    restart: unless-stopped
    depends_on:
      - sonya
    env_file: .env
    volumes:
      - sonya-data:/app/data
      - sonya-logs:/app/logs
      - ./knowledge:/app/knowledge:ro
    command: ["python", "-m", "sonya.payment_bot.main"]
    # Container exits with code 2 when PAY_BOT_TOKEN is empty — `restart:
    # unless-stopped` then keeps backing off. To run *without* a payment bot,
    # add `--scale payment_bot=0` or comment this service out.
    healthcheck:
      test: ["CMD", "true"]
      interval: 60s
      timeout: 5s
      retries: 1

volumes:
  sonya-data:
  sonya-logs:
