version: "3.9"

# Combine production stack — postgres + FastAPI backend (with SPA mounted on
# /app) + the Telethon worker. The existing Telegram userbot (sonya.main)
# and payment bot are deployed separately and not part of this compose.
#
# Both `backend` and `worker` read credentials (DB URL, JWT secret, Telegram
# API creds, etc.) from a shared `.env` file. Run alembic migrations inside
# the backend container before first use:
#   docker compose exec backend alembic upgrade head

services:
  db:
    image: postgres:16-alpine
    container_name: combine-db
    environment:
      POSTGRES_USER: sonya
      POSTGRES_PASSWORD: sonya
      POSTGRES_DB: sonya
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonya -d sonya"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: combine-backend:latest
    container_name: combine-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: combine-worker:latest
    container_name: combine-worker
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
